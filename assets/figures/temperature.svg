<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t"><title id="t">Documented temperature ranges</title><style>.t{font:700 17px/1.25 system-ui,sans-serif;fill:#111827;}.s{font:600 12.5px/1.4 system-ui,sans-serif;fill:#374151;}.m{font:400 12px/1.45 system-ui,sans-serif;fill:#4b5563;}.b{font:700 13px/1.3 system-ui,sans-serif;fill:#ffffff;}.x{font:600 11.5px/1.3 system-ui,sans-serif;fill:#6b7280;}.l{font:600 12px/1.3 system-ui,sans-serif;fill:#111827;}</style><rect width="900" height="520" fill="#ffffff"/><text x="22" y="34" class="t">Documented temperature ranges</text><text x="22" y="52" class="m">Each bar runs from the documented minimum to the documented maximum. The Chefman 8 Qt bar ends at 400 °F because the brand page and manual document 200–400 °F; the 450 °F the Amazon listing title advertises is a live conflict (F3) and is not asserted here.</text><text x="22" y="376" class="src">Sources: Chefman 6 Qt — S10, Emeril 26 QT — S15, Chefman 8 Qt — S12</text><rect x="308.21782178217825" y="150" width="376.2376237623762" height="34" fill="#2563eb" opacity=".9" rx="3"/><text x="298.21782178217825" y="172" class="x" text-anchor="end">200</text><text x="694.4554455445544" y="172" class="b">450</text><text x="90" y="138" class="l">Chefman 6 Qt</text><text x="90" y="206" class="m">Hi-Fry holds 450 °F for 2 minutes (finish mode, not full-cycle)</text><text x="90" y="224" class="src">Source S10</text><rect x="120.0990099009901" y="248" width="639.6039603960396" height="34" fill="#16a34a" opacity=".9" rx="3"/><text x="110.0990099009901" y="270" class="x" text-anchor="end">75</text><text x="769.7029702970297" y="270" class="b">500</text><text x="90" y="236" class="l">Emeril 26 QT</text><text x="90" y="304" class="m">Owner&#x27;s manual</text><text x="90" y="322" class="src">Source S15</text><rect x="308.21782178217825" y="346" width="300.990099009901" height="34" fill="#b45309" opacity=".9" rx="3"/><text x="298.21782178217825" y="368" class="x" text-anchor="end">200</text><text x="619.2079207920792" y="368" class="b">400</text><text x="90" y="334" class="l">Chefman 8 Qt</text><text x="90" y="402" class="m">Listing title advertises 450 °F Hi-Fry — conflict with brand page and manual, not asserted (F3)</text><text x="90" y="420" class="src">Source S12 · conflict: S29</text><line x1="90" y1="330" x2="850" y2="330" stroke="#9ca3af" stroke-width="1.5"/><text x="157.7227722772277" y="348" class="x" text-anchor="middle">100</text><text x="308.21782178217825" y="348" class="x" text-anchor="middle">200</text><text x="458.71287128712873" y="348" class="x" text-anchor="middle">300</text><text x="609.2079207920792" y="348" class="x" text-anchor="middle">400</text><text x="759.7029702970297" y="348" class="x" text-anchor="middle">500</text></svg>