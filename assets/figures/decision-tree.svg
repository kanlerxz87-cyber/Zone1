90.0" y="170" width="320" height="56" fill="#2563eb" rx="8"/><text x="250" y="189" class="b" text-anchor="middle">Cooking two different foods at once, on separate settings?</text><rect x="90.0" y="260" width="320" height="56" fill="#2563eb" rx="8"/><text x="250" y="279" class="b" text-anchor="middle">Replacing a toaster oven too — toast, bake, rotisserie?</text><rect x="90.0" y="350" width="320" height="56" fill="#2563eb" rx="8"/><text x="250" y="369" class="b" text-anchor="middle">Cooking for 4–6 people from one basket?</text><rect x="500.0" y="170" width="320" height="56" fill="#16a34a" rx="8"/><text x="660" y="189" class="b" text-anchor="middle">Chefman 6 Qt Dual Basket — Sync Finish, two 3-qt baskets</text><rect x="500.0" y="260" width="320" height="56" fill="#16a34a" rx="8"/><text x="660" y="279" class="b" text-anchor="middle">Emeril 26 QT French Door — rotisserie, 75–500 °F, 24 presets</text><rect x="500.0" y="350" width="320" height="56" fill="#16a34a" rx="8"/><text x="660" y="369" class="b" text-anchor="middle">Chefman 8 Qt TurboFry — one 8-qt basket, 200–400 °F</text><rect x="500.0" y="350" width="320" height="56" fill="#9ca3af" rx="8"/><text x="660" y="369" class="b" text-anchor="middle">Reconsider capacity before choosing a model</text></svg>