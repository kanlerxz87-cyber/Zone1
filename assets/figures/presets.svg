<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="fig-presets-title"><title id="fig-presets-title">Preset-count conflict — what each official document states</title><style>.t{font:700 17px/1.25 system-ui,sans-serif;fill:#111827;}.s{font:600 12.5px/1.4 system-ui,sans-serif;fill:#374151;}.m{font:400 12px/1.45 system-ui,sans-serif;fill:#4b5563;}.b{font:700 13px/1.3 system-ui,sans-serif;fill:#ffffff;}.x{font:600 11.5px/1.3 system-ui,sans-serif;fill:#6b7280;}.l{font:600 12px/1.3 system-ui,sans-serif;fill:#111827;}</style><rect width="900" height="520" fill="#ffffff"/><text x="22" y="34" class="t">Preset-count conflict — what each official document states</text><text x="22" y="52" class="m">The site states 24 presets for the Emeril 26 QT on the strength of the owner&#x27;s manual (S15); the brand page&#x27;s own specification block says 25 (S14), so the conflict stays open (F29). The Chefman 8 Qt documents four presets in both page and manual (S12, S13). For the Chefman 6 Qt dual-basket no official source publishes a preset count, so the row is blank (F36).</text><text x="22" y="712" class="src">Reading: bar length = preset count stated by that document. Red = one official document disagrees with another for the same product; no count is asserted until the conflict is settled.</text><rect x="90" y="150" width="643.2" height="30" fill="#2563eb" opacity=".9" rx="3"/><text x="741.2" y="171" class="b">24</text><text x="22" y="142" class="l">Owner&#x27;s manual (FAFO-001), Preset Mode Chart</text><text x="770" y="172" class="m">Names 24 presets by name; the controlling document</text><text x="22" y="194" class="src">Source S15</text><rect x="90" y="242" width="670.0" height="30" fill="#dc2626" opacity=".9" rx="3"/><text x="768.0" y="263" class="b">25</text><text x="22" y="234" class="l">Brand page specification block</text><text x="770" y="264" class="m">Contradicts the same page&#x27;s description (24) — conflict, not resolved (F29)</text><text x="22" y="286" class="src">Source S14</text><rect x="90" y="334" width="643.2" height="30" fill="#2563eb" opacity=".9" rx="3"/><text x="741.2" y="355" class="b">24</text><text x="22" y="326" class="l">Amazon listing title (B09B7SB46R)</text><text x="770" y="356" class="m">&quot;24 One-Touch Preset Options&quot;</text><text x="22" y="378" class="src">Source S28</text><rect x="90" y="426" width="107.19999999999999" height="30" fill="#2563eb" opacity=".9" rx="3"/><text x="205.2" y="447" class="b">4</text><text x="22" y="418" class="l">Brand page product features</text><text x="770" y="448" class="m">Fries, Chicken, Fish, Meat</text><text x="22" y="470" class="src">Source S12</text><rect x="90" y="518" width="107.19999999999999" height="30" fill="#2563eb" opacity=".9" rx="3"/><text x="205.2" y="539" class="b">4</text><text x="22" y="510" class="l">Owner&#x27;s manual RJ38-SQSS-8T</text><text x="770" y="540" class="m">Preset Function Chart, same four functions</text><text x="22" y="562" class="src">Source S13</text><text x="100" y="631" class="m">— not documented</text><text x="22" y="602" class="l">Owner&#x27;s manual RJ38-SQPF-3TDB-2W</text><text x="770" y="632" class="m">No preset chart published; count left blank, not inferred (F36)</text><text x="22" y="654" class="src">Source S18</text></svg>