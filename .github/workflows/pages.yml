name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node for generated-client checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test canonical output before rebuilding; validate code and public artifact
        run: bash scripts/ci-check.sh
      - name: Regenerate the research section from its own data
        run: python3 research/build_research.py
      - name: Verify the independent research section
        run: python3 research/check_research.py
      - name: Confirm independent research output remains current
        run: git diff --exit-code -- research/
      - name: Stage public files and label historical deployment copies
        # Never upload the checkout, runtime, .git, private scratch or dependencies.
        # The independent generators' committed files remain untouched.
        run: |
          python3 scripts/stage_pages.py --output _site
          python3 scripts/verify_staged.py _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
