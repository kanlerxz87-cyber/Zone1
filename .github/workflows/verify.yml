name: Rebuild and verify both builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-b-python:
    name: Build B (site/) — rebuild from data and assert every guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild every page from data/verified
        run: python3 scripts/build_site.py
      - name: Assert no unsourced values, no broken links, no policy breaches
        run: python3 scripts/verify_site.py
      - name: Fail if generated HTML has drifted from data/verified
        run: |
          if [ -n "$(git status --porcelain -- site/)" ]; then
            echo "::error::Generated HTML in site/ does not match data/verified/. Run 'python3 scripts/build_site.py' and commit the result."
            git --no-pager diff --stat -- site/
            exit 1
          fi
      - name: Confirm the required disclosure sentence is on every generated page
        run: |
          missing=0
          for f in site/*.html; do
            if ! grep -qF "As an Amazon Associate I earn from qualifying purchases." "$f"; then
              echo "::error file=$f::missing required Amazon disclosure sentence"
              missing=1
            fi
          done
          exit $missing

  build-a-node:
    name: Build A (docs/) — validate data and rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate data (no files written)
        run: node scripts/build.mjs --check
      - name: Rebuild docs/ and fail on drift
        run: |
          node scripts/build.mjs
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            echo "::error::Generated HTML in docs/ does not match data/. Run 'node scripts/build.mjs' and commit the result."
            git --no-pager diff --stat -- docs/
            exit 1
          fi
      - name: Confirm the required disclosure sentence is on every published page
        run: |
          missing=0
          for f in docs/*.html; do
            if ! grep -qF "As an Amazon Associate I earn from qualifying purchases." "$f"; then
              echo "::error file=$f::missing required Amazon disclosure sentence"
              missing=1
            fi
          done
          exit $missing
