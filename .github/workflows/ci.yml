name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Canonical, analytics, engine, annex and staged-artifact gates
        run: python3 scripts/annotated_check.py bash scripts/ci-check.sh

  browser:
    name: Local HTTPS browser and accessibility fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser-tools/package-lock.json
      - name: Install pinned test-only browser tools
        run: npm ci --prefix tests/browser-tools --no-audit --no-fund
      - name: Reflow, disclosures, keyboard, no-JS, print, accessibility and event receipt
        # All requests are local; external requests, including Amazon, are blocked.
        # Fixtures use an ephemeral database and never import campaign data.
        run: python3 scripts/annotated_check.py node tests/browser_check.cjs
