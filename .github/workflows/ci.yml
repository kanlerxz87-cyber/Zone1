name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Engine tests
        run: python3 -m unittest discover -s platform/tests -t platform -p "test_*.py"

      - name: Data audit — every row sourced, no inferred values
        run: python3 platform/audit/report.py

      - name: Rebuild site and prove the committed HTML is current
        run: |
          python3 scripts/build_s2_site.py
          python3 scripts/build_s2_site.py --check

      - name: Link and source coverage on rendered pages
        run: python3 scripts/check_links.py
