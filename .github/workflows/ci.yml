name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify the canonical publication
        run: |
          python3 build.py
          python3 verify.py
          git diff --exit-code

      - name: Publication, privacy and actual-client collector contract tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.cjs

      - name: Research rebuild and source verification
        run: |
          python3 research/build_research.py
          python3 research/check_research.py
          git diff --exit-code -- research/

      - name: Engine tests
        run: python3 -m unittest discover -s platform/tests -t platform -p "test_*.py"

      - name: Data audit — every row sourced, no inferred values
        run: python3 platform/audit/report.py

      - name: Prove the committed annex HTML is current
        # Was: run the builder, then run --check. The builder writes to the working tree, so
        # --check compared a rebuild against the files the previous line had just produced and
        # could not report a difference — a gate that cannot fail. --check alone rebuilds in
        # memory and compares against what is committed (found 2026-11-16 by arena/ba29c641;
        # proven to fire by editing one word in s2/pages/sources.html and watching it exit 1).
        # The header's build date is the single field the check now tolerates, because a
        # shallow CI checkout cannot see the commit that date is derived from.
        run: python3 scripts/build_s2_site.py --check

      - name: Link and source coverage on rendered pages
        run: python3 scripts/check_links.py

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install development-only browser tooling
        run: npm ci --ignore-scripts
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Rendered publication, no-JS, accessibility and actual-browser collector gates
        run: |
          npm run test:browser
          node scripts/check_publication_browser.mjs
      - name: Preserve scoped browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-evidence
          path: test-results/
          retention-days: 3

      # TEMPORARY (arena/915c51ea-zone1, 2026-11-20): the run log and its artifact are not
      # reachable from the session sandbox, so a failing browser job is unreadable there.
      # Echo the first lines of the failure into check-run annotations, which are readable
      # through the API. Remove once the gate is green on this branch.
      - name: Report browser-gate failure text as an annotation
        if: failure()
        run: |
          {
            node -e '
              const fs = require("fs");
              const f = "test-results/browser-results.json";
              if (!fs.existsSync(f)) { console.log("no playwright json"); process.exit(0); }
              const r = JSON.parse(fs.readFileSync(f, "utf8"));
              const out = [];
              const walk = (suite, trail) => {
                for (const spec of suite.specs || [])
                  for (const t of spec.tests || [])
                    for (const res of t.results || [])
                      if (res.status !== "passed" || (res.errors || []).length)
                        out.push([trail, spec.title].filter(Boolean).join(" › ") + " :: " +
                          (res.errors || []).map(e => (e.message || e.value || "").replace(/\s+/g, " ").slice(0, 400)).join(" | "));
                for (const child of suite.suites || []) walk(child, trail ? trail + " › " + suite.title : suite.title);
              };
              for (const s of r.suites || []) walk(s, "");
              console.log(out.slice(0, 8).join("\n") || "playwright json shows no failure");
            '
            echo "--- check_publication_browser.mjs (rerun, first lines) ---"
            node scripts/check_publication_browser.mjs 2>&1 | head -25 || true
          } | sed -n '1,40p' | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/%25'/$'\n'/%0A'/$'\r'/%0D'}"
          done
