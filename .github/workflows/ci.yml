name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Canonical rebuild, verification and committed-output gate
        run: |
          python3 build.py
          python3 verify.py
          git diff --exit-code -- .

      - name: Research rebuild and verification
        run: |
          python3 research/build_research.py
          python3 research/check_research.py
          git diff --exit-code -- research/

      - name: Engine tests
        run: python3 -m unittest discover -s platform/tests -t platform -p "test_*.py"

      - name: Canonical publication and analytics regression tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.cjs

      - name: Install disposable browser test dependencies
        run: npm install --prefix .cache/browser --no-save --no-package-lock playwright-core@1.65.1 @sparticuz/chromium@153.0.0

      - name: Responsive, keyboard, no-JS and network acceptance
        run: node scripts/check_publication_browser.mjs

      - name: Data audit — every row sourced, no inferred values
        run: python3 platform/audit/report.py

      - name: Prove the committed annex HTML is current
        # Was: run the builder, then run --check. The builder writes to the working tree, so
        # --check compared a rebuild against the files the previous line had just produced and
        # could not report a difference — a gate that cannot fail. --check alone rebuilds in
        # memory and compares against what is committed (found 2026-11-16 by arena/ba29c641;
        # proven to fire by editing one word in s2/pages/sources.html and watching it exit 1).
        # The header's build date is the single field the check now tolerates, because a
        # shallow CI checkout cannot see the commit that date is derived from.
        run: python3 scripts/build_s2_site.py --check

      - name: Link and source coverage on rendered pages
        run: python3 scripts/check_links.py
